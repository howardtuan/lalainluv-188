{% extends 'backoffice/base.html' %}
{% block content %}<div class="page-heading"><div><span>Every order, carefully kept.</span><h1>訂單管理</h1><p>會員送出後，商品明細、收件資料、金額與備註都會完整保留。</p></div><span class="status-tag">人工確認・不串金流</span></div><form class="manage-filters" method="get"><input class="form-control" type="search" name="q" value="{{ query }}" placeholder="訂單編號、姓名或信箱" aria-label="搜尋訂單"><select class="form-control" name="status" aria-label="訂單狀態"><option value="">全部狀態</option>{% for value,label in statuses %}<option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn btn--outline" type="submit">篩選</button></form>{% include 'backoffice/includes/order_table.html' with orders=page_obj %}{% include 'backoffice/includes/pagination.html' %}{% endblock %}
