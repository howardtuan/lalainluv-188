{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="管理列表分頁">{% if page_obj.has_previous %}<a href="?q={{ query|urlencode }}&state={{ state|urlencode }}&status={{ status|urlencode }}&page={{ page_obj.previous_page_number }}">← 上一頁</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?q={{ query|urlencode }}&state={{ state|urlencode }}&status={{ status|urlencode }}&page={{ page_obj.next_page_number }}">下一頁 →</a>{% endif %}</nav>{% endif %}
