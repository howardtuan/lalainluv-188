{% extends 'backoffice/base.html' %}
{% block content %}<div class="narrow-page"><nav class="breadcrumb"><a href="{{ back_url }}">返回管理列表</a><span>/</span><span>{{ title }}</span></nav><div class="page-heading"><div><h1>{{ title }}</h1><p>儲存後會立即更新前台顯示。</p></div></div><form method="post" enctype="multipart/form-data" class="form-panel" data-single-submit>{% csrf_token %}{% if object.image %}<img class="edit-image-preview" data-image-preview src="{{ object.image.url }}" alt="目前圖片">{% elif active_section == 'banners' %}<img class="edit-image-preview" data-image-preview hidden alt="廣告圖片預覽">{% endif %}{% include 'includes/form_fields.html' %}<div class="editor-actions"><button class="btn btn--primary" type="submit" data-label="儲存變更">儲存變更</button><a class="btn btn--outline" href="{{ back_url }}">取消</a></div></form></div>{% endblock %}
